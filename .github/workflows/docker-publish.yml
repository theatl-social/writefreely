name: Publish image

on:
  push:
    branches: [theatl-main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # theATL fork: this job holds credentials for the Docker Hub registry
      # our production host pulls from, so every action here is pinned to an
      # exact release, not a floating major tag (the same reasoning that ruled
      # out trufflehog@main in ci.yml).
      - uses: actions/checkout@v7.0.1
        with:
          # git describe needs tags. fetch-depth: 0 alone is not sufficient —
          # actions/checkout still passes --no-tags to the underlying fetch
          # unless fetch-tags is set explicitly, so a fresh CI checkout has
          # full history but zero tag refs. Confirmed by a failed run: "fatal:
          # No names found, cannot describe anything."
          fetch-depth: 0
          fetch-tags: true

      - name: Compute tag
        id: tag
        # Derived from the nearest upstream v* tag rather than hardcoded. A
        # hardcoded "0.17.1-" prefix would keep claiming 0.17.1 forever: after a
        # merge to v0.18.0 every image would carry a tag that misnames its own
        # upstream base, and that tag is what the deployment pins in
        # ovh/docker-compose.yml. Yields e.g. 0.17.1-14-ga668231 — immutable,
        # distinct per commit, and self-correcting across upstream merges.
        run: echo "value=$(git describe --tags --match 'v*' --abbrev=7 | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      # theATL fork: pinned to an exact release, not a floating major tag.
      # No `registry:` — Docker Hub is docker/login-action's default when
      # one isn't given. DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are repo secrets;
      # the token must be an access token (Docker Hub account settings ->
      # Personal access tokens), not the account password.
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # theATL fork: pinned to an exact release, not a floating major tag.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: mikehdev/writefreely:${{ steps.tag.outputs.value }}
